<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", sans-serif;
      background: #f0f0f0;
      color: #111;
      text-align: center;
      overflow-x: hidden;
    }

    .page {
      padding: 24px;
      max-width: 760px;
      margin: 0 auto;
    }

    .top-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .top-row a,
    .top-row button {
      font-size: 18px;
      padding: 12px 22px;
      border-radius: 14px;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      cursor: pointer;
      text-decoration: none;
    }

    canvas {
      width: 100%;
      max-width: 400px;
      height: auto;
      background: #111;
      display: block;
      margin: 0 auto;
      border: 10px solid #000;
      border-radius: 16px;
      image-rendering: pixelated;
    }

    .score {
      font-size: 24px;
      margin: 18px 0;
    }

    .info {
      max-width: 640px;
      margin: 16px auto;
      font-size: 16px;
      color: #333;
      line-height: 1.6;
    }

    footer {
      margin-top: 30px;
      color: #444;
    }

    /* MOBILE CONTROLS */

    .mobile-controls {
      margin-top: 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .middle-row {
      display: flex;
      gap: 10px;
    }

    .mobile-controls button {
      width: 70px;
      height: 70px;
      font-size: 28px;
      border: none;
      border-radius: 18px;
      background: #222;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      touch-action: manipulation;
      cursor: pointer;
    }

    .mobile-controls button:active {
      transform: scale(0.95);
    }

    @media (max-width: 768px) {
      .mobile-controls {
        display: flex;
      }

      .page {
        padding: 16px;
      }

      .top-row a,
      .top-row button {
        font-size: 16px;
        padding: 10px 18px;
      }
    }

    @media (max-width: 500px) {
      .top-row a,
      .top-row button {
        font-size: 14px;
        padding: 10px 14px;
      }

      .info {
        font-size: 14px;
      }

      .mobile-controls button {
        width: 60px;
        height: 60px;
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="top-row">
      <a href="spacb.html">Back</a>
      <button id="restartBtn">Restart</button>
    </div>

    <h1>Snake Game</h1>

    <p class="score">
      Score: <span id="score">0</span>
    </p>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- MOBILE BUTTONS -->

    <div class="mobile-controls">

      <button onclick="setDirection(0,-1)">⬆</button>

      <div class="middle-row">
        <button onclick="setDirection(-1,0)">⬅</button>
        <button onclick="setDirection(1,0)">➡</button>
      </div>

      <button onclick="setDirection(0,1)">⬇</button>

    </div>

    <p class="info">
      Use arrow keys, WASD, or mobile buttons to move the snake.
      Eat red apples to grow. Avoid walls and yourself.
    </p>

    <footer>
      Pixelcord5 :O 2026
    </footer>

  </div>

  <script>

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const tileCount = 20;
    const tileSize = canvas.width / tileCount;

    let snake = [{ x: 9, y: 9 }];
    let velocity = { x: 1, y: 0 };

    let apple = { x: 5, y: 5 };

    let score = 0;
    let gameOver = false;

    let moveQueue = [];
    let gameInterval;

    function resetGame() {

      snake = [{ x: 9, y: 9 }];

      velocity = { x: 1, y: 0 };

      apple = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };

      score = 0;

      gameOver = false;

      moveQueue = [];

      document.getElementById("score").innerText = score;

      clearInterval(gameInterval);

      gameInterval = setInterval(gameLoop, 100);

      draw();
    }

    function drawRect(x, y, color) {

      ctx.fillStyle = color;

      ctx.fillRect(
        x * tileSize,
        y * tileSize,
        tileSize - 1,
        tileSize - 1
      );
    }

    function gameLoop() {

      if (gameOver) return;

      if (moveQueue.length) {

        const next = moveQueue.shift();

        if (
          next.x !== -velocity.x ||
          next.y !== -velocity.y
        ) {
          velocity = next;
        }
      }

      const head = {
        x: snake[0].x + velocity.x,
        y: snake[0].y + velocity.y
      };

      const hitWall =
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount;

      const hitSelf = snake.some(
        segment =>
          segment.x === head.x &&
          segment.y === head.y
      );

      if (hitWall || hitSelf) {
        return endGame();
      }

      snake.unshift(head);

      if (
        head.x === apple.x &&
        head.y === apple.y
      ) {

        score++;

        document.getElementById("score").innerText = score;

        placeApple();

      } else {

        snake.pop();
      }

      draw();
    }

    function placeApple() {

      apple = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };

      if (
        snake.some(
          segment =>
            segment.x === apple.x &&
            segment.y === apple.y
        )
      ) {
        placeApple();
      }
    }

    function draw() {

      ctx.fillStyle = "#111";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      drawRect(apple.x, apple.y, "#d33");

      snake.forEach((segment, index) => {

        drawRect(
          segment.x,
          segment.y,
          index === 0 ? "#0f0" : "#6c3"
        );

      });
    }

    function endGame() {

      gameOver = true;

      clearInterval(gameInterval);

      ctx.fillStyle = "rgba(0,0,0,0.75)";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.fillStyle = "#fff";

      ctx.font = "24px Comic Sans MS";

      ctx.textAlign = "center";

      ctx.fillText(
        "Game Over!",
        canvas.width / 2,
        canvas.height / 2 - 12
      );

      ctx.font = "16px Comic Sans MS";

      ctx.fillText(
        "Press Restart to play again",
        canvas.width / 2,
        canvas.height / 2 + 18
      );
    }

    function setDirection(x, y) {

      moveQueue.push({ x, y });
    }

    window.addEventListener("keydown", e => {

      if (
        ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "]
        .includes(e.key)
      ) {
        e.preventDefault();
      }

      const key = e.key;

      if (key === "ArrowUp" || key === "w" || key === "W") {
        moveQueue.push({ x: 0, y: -1 });
      }

      if (key === "ArrowDown" || key === "s" || key === "S") {
        moveQueue.push({ x: 0, y: 1 });
      }

      if (key === "ArrowLeft" || key === "a" || key === "A") {
        moveQueue.push({ x: -1, y: 0 });
      }

      if (key === "ArrowRight" || key === "d" || key === "D") {
        moveQueue.push({ x: 1, y: 0 });
      }

    });

    document
      .getElementById("restartBtn")
      .addEventListener("click", resetGame);

    resetGame();

  </script>

</body>
</html>
