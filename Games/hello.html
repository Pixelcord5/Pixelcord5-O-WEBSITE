<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Animated background scanlines */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(15, 240, 0, 0.03),
                rgba(15, 240, 0, 0.03) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            animation: scan 8s linear infinite;
            z-index: -1;
        }

        @keyframes scan {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(10px);
            }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid #0f0;
            border-radius: 5px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.05);
        }

        .title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
            animation: flicker 3s infinite;
        }

        .subtitle {
            text-align: center;
            color: #0a0;
            font-size: 12px;
            margin-bottom: 30px;
            opacity: 0.7;
        }

        .input-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #0a0e27;
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
        }

        input[type="text"]:focus {
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.5), 0 0 20px rgba(0, 255, 0, 0.3);
            border-color: #0f0;
        }

        input[type="text"]::placeholder {
            color: #0a0;
            opacity: 0.5;
        }

        .output-section {
            margin-top: 30px;
        }

        .output-label {
            font-size: 14px;
            color: #0f0;
            margin-bottom: 12px;
            text-shadow: 0 0 5px #0f0;
        }

        .binary-output {
            background: #050a18;
            border: 2px solid #0f0;
            border-radius: 3px;
            padding: 20px;
            font-size: 18px;
            line-height: 1.8;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            word-break: break-all;
            min-height: 100px;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.1), 0 0 15px rgba(0, 255, 0, 0.2);
            font-weight: bold;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px #0f0;
            }
            50% {
                text-shadow: 0 0 20px #0f0, 0 0 30px #0f0;
            }
        }

        @keyframes flicker {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 10px #0f0, 0 0 20px #0f0;
            }
            50% {
                opacity: 0.9;
                text-shadow: 0 0 5px #0f0;
            }
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            background: #0a0e27;
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 5px #0f0;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        button:hover {
            background: #0f0;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8), inset 0 0 10px rgba(0, 255, 0, 0.3);
            text-shadow: none;
        }

        button:active {
            transform: scale(0.95);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            font-size: 12px;
            color: #0a0;
            opacity: 0.8;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            color: #0f0;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #0f0;
        }

        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #0f0;
            margin-left: 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }
            50%, 100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            PIXELCORD5'S HACK CLIENT :O
        </div>
        <div class="subtitle">
            &gt; SYSTEM INITIALIZED &lt; _
        </div>

        <div class="input-section">
            <label for="textInput">ENTER TEXT:</label>
            <input 
                type="text" 
                id="textInput" 
                placeholder="Type something to decode..."
                autocomplete="off"
            >
        </div>

        <div class="output-section">
            <div class="output-label">BINARY CODE:</div>
            <div class="binary-output" id="binaryOutput">
                11110000 11110000 11110000
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                CHARACTERS: <div class="stat-number" id="charCount">0</div>
            </div>
            <div class="stat-item">
                BITS: <div class="stat-number" id="bitCount">0</div>
            </div>
            <div class="stat-item">
                STATUS: <div class="stat-number" id="status" style="color: #0a0;">READY</div>
            </div>
        </div>

        <div class="button-group">
            <button onclick="window.location.href='spacb.html'">BACK</button>
            <button onclick="copyToClipboard()">COPY CODE</button>
            <button onclick="clearAll()">CLEAR SYSTEM</button>
        </div>
    </div>

    <footer style="text-align: center; margin-top: 30px; color: #0a0; font-size: 12px; opacity: 0.7;">
        Pixelcord5 :O 2026
    </footer>

    <script>
        const textInput = document.getElementById('textInput');
        const binaryOutput = document.getElementById('binaryOutput');
        const charCount = document.getElementById('charCount');
        const bitCount = document.getElementById('bitCount');
        const statusDisplay = document.getElementById('status');

        function textToBinary(text) {
            return text.split('').map(char => {
                const binary = char.charCodeAt(0).toString(2);
                return binary.padStart(8, '0');
            }).join(' ');
        }

        function updateBinary() {
            const text = textInput.value;
            
            if (text.length === 0) {
                binaryOutput.textContent = '11110000 11110000 11110000';
                charCount.textContent = '0';
                bitCount.textContent = '0';
                statusDisplay.textContent = 'READY';
                statusDisplay.style.color = '#0a0';
                return;
            }

            const binary = textToBinary(text);
            binaryOutput.textContent = binary;
            charCount.textContent = text.length;
            bitCount.textContent = text.length * 8;
            
            statusDisplay.textContent = 'PROCESSING...';
            statusDisplay.style.color = '#0f0';
            
            setTimeout(() => {
                statusDisplay.textContent = 'COMPLETE';
                statusDisplay.style.color = '#0f0';
            }, 300);
        }

        function copyToClipboard() {
            const binary = binaryOutput.textContent;
            navigator.clipboard.writeText(binary).then(() => {
                const originalText = statusDisplay.textContent;
                statusDisplay.textContent = 'COPIED!';
                statusDisplay.style.color = '#0f0';
                setTimeout(() => {
                    statusDisplay.textContent = originalText;
                }, 1500);
            });
        }

        function clearAll() {
            textInput.value = '';
            binaryOutput.textContent = '11110000 11110000 11110000';
            charCount.textContent = '0';
            bitCount.textContent = '0';
            statusDisplay.textContent = 'READY';
            statusDisplay.style.color = '#0a0';
            textInput.focus();
        }

        textInput.addEventListener('input', updateBinary);
        textInput.focus();
    </script>
</body>
</html>
