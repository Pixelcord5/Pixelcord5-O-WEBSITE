    <!-- MEOW SECTION -->
    <button onclick="playMeow()">Meow</button>
    <div id="meowText" style="height: 30px; font-weight: bold; color: orange;"></div> <!-- ADDED THIS ELEMENT -->

    <audio id="meowAudio">
        <source src="meow.wav" type="audio/wav">
        Your browser does not support the audio element.
    </audio>


    <!-- MUSIC SECTION -->
    <button id="musicBtn" onclick="toggleMusic()">▶ Play Music</button>
    <audio id="bgMusic">
      <source src="lofi.mp3" type="audio/mpeg">
    </audio>

   
    <!-- QUIT SECTION -->
    <h3> Quit? </h3>
    <button class="quit-button" onclick="saveAndQuit()">Save and quit to browser</button>

    <!-- ALL SCRIPTS TOGETHER -->
    <script>
        // 1. MEOW FUNCTION
        function playMeow() {
            const audio = document.getElementById("meowAudio");
            audio.currentTime = 0; 
            audio.play();

            const textElement = document.getElementById("meowText");
            textElement.innerText = "Meow!"; // Show text

            setTimeout(() => {
                textElement.innerText = ""; // Hide text after 1 second
            }, 1000);
        }

        // 2. MUSIC FUNCTION
        function toggleMusic() {
            var audio = document.getElementById("bgMusic");
            var btn = document.getElementById("musicBtn");
            if (audio.paused) {
                audio.play();
                btn.innerText = "⏸ Pause";
            } else {
                audio.pause();
                btn.innerText = "▶ Play";
            }
        }

        // 3. QUIT FUNCTION
        function saveAndQuit() {
            
            window.location.href = "https://www.google.com/logos/2010/pacman10-i.html";
        }
    </script>
