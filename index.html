    <!-- ALL SCRIPTS TOGETHER -->
    <script>
        // 1. MEOW FUNCTION
        function playMeow() {
            const audio = document.getElementById("meowAudio");
            audio.currentTime = 0; 
            audio.play();

            const textElement = document.getElementById("meowText");
            textElement.innerText = "Meow!"; // Show text

            setTimeout(() => {
                textElement.innerText = ""; // Hide text after 1 second
            }, 1000);
        }

        // 2. MUSIC FUNCTION
        function toggleMusic() {
            var audio = document.getElementById("bgMusic");
            var btn = document.getElementById("musicBtn");
            if (audio.paused) {
                audio.play();
                btn.innerText = "⏸ Pause";
            } else {
                audio.pause();
                btn.innerText = "▶ Play";
            }
        }

        document.getElementById('switch').addEventListener('click', () => {
  const h = Math.floor(Math.random() * 360);
  document.documentElement.style.setProperty('--pastel-hue', h);
});
