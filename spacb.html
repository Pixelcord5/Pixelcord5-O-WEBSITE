<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games</title>
  <style>
    body {
      font-family: "Comic Sans MS", sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f4f4f4;
      color: #111;
      text-align: center;
    }

    main {
      max-width: 760px;
      margin: 60px auto 20px;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      margin-bottom: 24px;
      color: #333;
    }

    .game-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    button {
      font-size: 20px;
      padding: 14px 24px;
      border-radius: 14px;
      border: 2px solid #000;
      background: #fff;
      cursor: pointer;
      color: #000;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 18px;
      padding: 10px 18px;
    }

    footer {
      margin-top: 40px;
      color: #444;
    }

    @media (max-width: 760px) {
      main {
        margin: 40px auto 20px;
      }
      .game-links {
        gap: 10px;
      }
      button {
        width: 100%;
        font-size: 18px;
        padding: 14px 20px;
      }
      .back-btn {
        font-size: 16px;
        padding: 10px 16px;
        left: 10px;
      }
    }

    @media (max-width: 500px) {
      button {
        padding: 12px 18px;
      }
      .back-btn {
        top: 10px;
      }
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="window.location.href='../index.html'">Back</button>
  <main>
    <h1>Games</h1>
    <p>Choose a mini-game to play.</p>
    <div class="game-links">
      <button onclick="window.location.href='Clicker-game.html'">Clicker Game</button>
      <button onclick="window.location.href='spa.html'">Spacebar Clicker</button>
      <button onclick="window.location.href='gale.html'">Snake Game</button>
       <button onclick="window.location.href='hello.html'">Hack Client (FAKE)</button>
       <button onclick="window.location.href='dvd.html'">DVD Screensaver</button>
    </div>
  </main>
  <footer>Pixelcord5 :O 2026</footer>
</body>
</html>
